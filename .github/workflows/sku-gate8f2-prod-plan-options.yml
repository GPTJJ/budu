name: READ ONLY SKU Gate 8F2 Exact Image Production Plan

on:
  push:
    branches: [codex/sku-gate8f2-prod-plan-options]

permissions:
  contents: read

concurrency:
  group: sku-gate8f2-one-time-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated diagnostic code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout frozen v5 candidate
        uses: actions/checkout@v4
        with:
          repository: GPTJJ/budu
          ref: 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec
          path: candidate
          fetch-depth: 0
      - name: Verify one-time branch and frozen candidate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = GPTJJ/budu
          test "$GITHUB_REF" = refs/heads/codex/sku-gate8f2-prod-plan-options
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --count 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec..HEAD)" = 1
          test "$(git -C candidate rev-parse HEAD)" = 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          PYTHONDONTWRITEBYTECODE=1 python3 candidate/scripts/deploy-prod-sku-authority.py identity --repo "$PWD/candidate"
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast
          for path in ('scripts/sku-gate8d-readonly-audit.py',
                       'scripts/sku-gate8f2-prod-plan-options.py'):
              ast.parse(open(path).read())
          PY
          node --check scripts/sku-gate8d-analyze.mjs
          node --check scripts/sku-gate8f2-stage.mjs
      - name: Configure pinned production read-only entry
        env:
          SSH_KEY: ${{ secrets.BJ_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '154.8.195.42 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHJJGZ1Kape1om+8xOhoI7IsgvKN1tw6sh8l7PGisgtb' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Diagnose exact image plan on live writer production DB
        env:
          BJ_HOST: ${{ secrets.BJ_HOST }}
          BJ_USER: ${{ secrets.BJ_USER }}
          CANDIDATE_SHA: 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec
          AUDIT_AUTHORIZATION: SKU_GATE_8F2_READONLY
          PYTHONDONTWRITEBYTECODE: '1'
          TRANSFER_CAS_KNOWN_HOSTS: /home/runner/.ssh/known_hosts
        run: |
          set -euo pipefail
          python3 scripts/sku-gate8f2-prod-plan-options.py --candidate "$PWD/candidate"
