name: Partner Release Read Only Audit

on:
  push:
    branches: [codex/partner-import-diagnosis]
    paths:
      - .github/workflows/partner-import-diagnosis.yml
      - scripts/diagnose-partner-ssh.py

permissions:
  contents: read
  actions: read

concurrency:
  group: partner-release-read-only-audit
  cancel-in-progress: false

jobs:
  read-only-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure existing production SSH identity
        env:
          SSH_KEY: ${{ secrets.BJ_SSH_KEY }}
          SSH_HOST: ${{ secrets.BJ_HOST }}
          SSH_USER: ${{ secrets.BJ_USER }}
        run: |
          set -euo pipefail
          test "$SSH_HOST" = 154.8.195.42
          test "$SSH_USER" = ubuntu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Read production authority and staged artifact progress
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GH_TOKEN: ${{ github.token }}
          HK_SSH_KEY: ${{ secrets.HK_SSH_KEY || secrets.TENCENT_SSH_KEY }}
          HK_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
          HK_USER: ${{ secrets.HK_USER || secrets.TENCENT_USER }}
        run: python3 scripts/diagnose-partner-ssh.py
      - name: Retain diagnostic measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-release-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/partner-ssh-diagnosis/result.json
          if-no-files-found: warn
          retention-days: 3
      - name: Remove runner SSH identity
        if: always()
        run: rm -f ~/.ssh/id_ed25519
