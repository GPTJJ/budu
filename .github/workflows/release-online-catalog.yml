name: Release Online Catalog (migration)

# Dedicated migration release path. The standard "Deploy to Beijing Prod"
# profile rejects every prisma diff, so schema releases use their own contract.
on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Exact current production SHA (must be e9156123...)'
        required: true
        type: string
      authorize_release_sha:
        description: 'Exact SHA authorized for this release (must equal github.sha)'
        required: true
        type: string

concurrency:
  group: deploy-bj-online-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
      AUTHORIZE_RELEASE_SHA: ${{ inputs.authorize_release_sha }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact release identity
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/online-catalog-admin-002
          test "$AUTHORIZE_RELEASE_SHA" = "$GITHUB_SHA"
          test "$EXPECTED_PRODUCTION_SHA" = e91561238b866284bb6621a57fc02926fba01ec8
          python3 scripts/test-online-catalog-release.py
          python3 scripts/deploy-prod-online-catalog.py identity \
            --repo "$PWD" --release-sha "$GITHUB_SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Build exact linux/amd64 archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact" "$RUNNER_TEMP/source"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/source"
          docker buildx build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "budu-api:post-transfer-${GITHUB_SHA:0:12}" \
            --provenance=false --sbom=false \
            --output "type=docker,compression=gzip,compression-level=9,force-compression=true,dest=$RUNNER_TEMP/artifact/image.tar" \
            "$RUNNER_TEMP/source"
          sha256sum "$RUNNER_TEMP/artifact/image.tar"

      - name: Inspect archive under the contract
        run: |
          set -euo pipefail
          python3 scripts/deploy-prod-online-catalog.py inspect-artifact \
            --repo "$PWD" --release-sha "$GITHUB_SHA" --archive "$RUNNER_TEMP/artifact/image.tar"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BJ_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '154.8.195.42 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHJJGZ1Kape1om+8xOhoI7IsgvKN1tw6sh8l7PGisgtb' > "$RUNNER_TEMP/known_hosts"
          chmod 600 "$RUNNER_TEMP/known_hosts"

      - name: Read-only preflight
        env:
          TRANSFER_CAS_KNOWN_HOSTS: ${{ runner.temp }}/known_hosts
        run: |
          set -euo pipefail
          python3 scripts/deploy-prod-online-catalog.py preflight \
            --repo "$PWD" --release-sha "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/artifact/image.tar" --ssh-key ~/.ssh/id_ed25519

      - name: Blue-green deploy with atomic migration
        env:
          TRANSFER_CAS_KNOWN_HOSTS: ${{ runner.temp }}/known_hosts
        run: |
          set -euo pipefail
          python3 scripts/deploy-prod-online-catalog.py deploy \
            --repo "$PWD" --release-sha "$GITHUB_SHA" \
            --archive "$RUNNER_TEMP/artifact/image.tar" --ssh-key ~/.ssh/id_ed25519 \
            --authorize-release-sha "$AUTHORIZE_RELEASE_SHA"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
