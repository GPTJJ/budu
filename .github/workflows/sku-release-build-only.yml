name: NON_PRODUCTION SKU Release Controller V3

on:
  push:
    branches: [codex/sku-authority-release-controller-v3]

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sku_test
          POSTGRES_PASSWORD: sku_test
          POSTGRES_DB: sku_authority_test_gate8a
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sku_test -d sku_authority_test_gate8a"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sku_test:sku_test@127.0.0.1:5432/sku_authority_test_gate8a
      TEST_DATABASE_URL: postgresql://sku_test:sku_test@127.0.0.1:5432/sku_authority_test_gate8a
      NODE_ENV: test
      APP_ENV: test
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify exact source and schema-aware identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/codex/sku-authority-release-controller-v3
          if [ -z "$(git branch --show-current)" ]; then
            git switch -c codex/sku-authority-release-controller-v3
          fi
          test "$(git branch --show-current)" = codex/sku-authority-release-controller-v3
          python3 scripts/deploy-prod-sku-authority.py identity --repo "$PWD"
          python3 scripts/test-sku-release-contract.py
          python3 scripts/test-sku-release-controller.py
          python3 scripts/test-sku-release-readiness.py
          node scripts/test-sku-release-readiness.mjs
          python3 scripts/test-release-path-post-transfer.py
          python3 scripts/test-deploy-prod-transfer-cas.py
          node --check scripts/sku-release-apply.mjs
          test -z "$(git status --porcelain --untracked-files=all)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma validate && npx prisma generate
      - name: Rehearse Gate 8B SAFE_DEGRADED on PostgreSQL 16
        run: node scripts/test-sku-old-app-safe-degraded.mjs
      - name: Reset disposable PostgreSQL for candidate regression
        run: npx prisma migrate reset --force --skip-seed
      - name: Verify SKU writer capability and atomicity
        run: node scripts/test-sku-authority-native.mjs
      - name: Reset disposable PostgreSQL for release adapter
        run: npx prisma migrate reset --force --skip-seed
      - name: Execute SKU release data adapter and post-cutover reconciliation
        run: node scripts/test-sku-release-apply-native.mjs
      - name: Verify post-cutover Order and generic authority row preservation
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 scripts/test-sku-release-lossless-native.py
      - name: Rehearse pre-cutover database restore after three failure points
        run: python3 scripts/test-sku-release-restore-native.py
      - run: node --test scripts/test-sku-authority-unit.mjs scripts/test-product-excel.mjs
      - run: npm run build
      - name: Build and inspect exact production-format image off-host
        run: |
          set -euo pipefail
          run_dir="$(mktemp -d "$RUNNER_TEMP/sku-release-build.XXXXXX")"
          mkdir "$run_dir/source"
          git archive "$GITHUB_SHA" | tar -x -C "$run_dir/source"
          docker buildx create --name "sku-release-$GITHUB_RUN_ID" --driver docker-container
          docker buildx build --builder "sku-release-$GITHUB_RUN_ID" --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "budu-api:sku-authority-${GITHUB_SHA:0:12}" \
            --provenance=false --sbom=false \
            --output "type=docker,compression=gzip,compression-level=9,force-compression=true,dest=$run_dir/image.tar" \
            "$run_dir/source"
          docker buildx build --builder "sku-release-$GITHUB_RUN_ID" --target builder --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "budu-api:sku-migration-${GITHUB_SHA:0:12}" \
            --provenance=false --sbom=false \
            --output "type=docker,compression=gzip,compression-level=9,force-compression=true,dest=$run_dir/migration.tar" \
            "$run_dir/source"
          python3 scripts/deploy-prod-sku-authority.py inspect-artifact --repo "$PWD" \
            --archive "$run_dir/image.tar" --migration-archive "$run_dir/migration.tar"
      - name: Clean worktree guard
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"
