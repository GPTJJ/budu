name: Deploy to HK Test

on:
  workflow_dispatch:

concurrency:
  group: deploy-hk-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HK_SSH_KEY || secrets.TENCENT_SSH_KEY }}
          SSH_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 磁盘检查与清理（系统盘满会导致 Failed to fetch）
        env:
          SSH_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
          SSH_USER: ${{ secrets.HK_USER || secrets.TENCENT_USER }}
          APP_DIR: ${{ secrets.HK_APP_DIR || secrets.TENCENT_APP_DIR }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "df -h / | tail -1; echo '--- 清理日志与缓存 ---'; sudo find /var/log -type f -name '*.log' -size +10M -exec truncate -s 0 {} \; 2>/dev/null || true; sudo journalctl --vacuum-size=100M 2>/dev/null || true; sudo apt-get clean 2>/dev/null || true; rm -rf \$APP_DIR/dist /tmp/*.log /home/*/.npm/_logs 2>/dev/null || true; docker system prune -af 2>/dev/null || true; df -h / | tail -1" || true

      - name: Deploy to HK test
        env:
          SSH_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
          SSH_USER: ${{ secrets.HK_USER || secrets.TENCENT_USER }}
          APP_DIR: ${{ secrets.HK_APP_DIR || secrets.TENCENT_APP_DIR }}
        run: bash scripts/deploy-remote.sh "$SSH_HOST" "$SSH_USER" "$APP_DIR" "$GITHUB_SHA" test
