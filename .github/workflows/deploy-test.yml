name: Deploy to HK Test

on:
  workflow_dispatch:

concurrency:
  group: deploy-hk-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HK_SSH_KEY || secrets.TENCENT_SSH_KEY }}
          SSH_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to HK test
        env:
          SSH_HOST: ${{ secrets.HK_HOST || secrets.TENCENT_HOST }}
          SSH_USER: ${{ secrets.HK_USER || secrets.TENCENT_USER }}
          APP_DIR: ${{ secrets.HK_APP_DIR || secrets.TENCENT_APP_DIR }}
        run: bash scripts/deploy-remote.sh "$SSH_HOST" "$SSH_USER" "$APP_DIR" "$GITHUB_SHA" test
