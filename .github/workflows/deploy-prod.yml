name: Deploy to Beijing Prod

on:
  workflow_dispatch:
    inputs:
      expected_production_sha:
        description: 'Post-Transfer: exact current Production SHA'
        required: false
        type: string
      approved_business_sha:
        description: 'Post-Transfer: reviewed business runtime SHA'
        required: false
        type: string
      authorize_release_sha:
        description: 'Post-Transfer: exact SHA authorized for deployment'
        required: false
        type: string

concurrency:
  group: deploy-bj-prod
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.BJ_SSH_KEY }}
          SSH_HOST: ${{ secrets.BJ_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Restore retained exact release artifact for resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="release-staging-$GITHUB_SHA"
          artifact_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name" \
            --jq ".artifacts | map(select(.expired == false and .workflow_run.head_sha == \"$GITHUB_SHA\")) | sort_by(.id) | last | .workflow_run.id // empty")"
          if [ -n "$artifact_run" ]; then
            target="$RUNNER_TEMP/retained-release-$GITHUB_SHA"
            mkdir -m 700 "$target"
            gh run download "$artifact_run" --name "$name" --dir "$target"
            test -f "$target/image.tar"
            printf 'RETAINED_RELEASE_ARTIFACT=%s/image.tar\n' "$target" >> "$GITHUB_ENV"
          fi

      - name: Deploy to Beijing prod
        env:
          SSH_HOST: ${{ secrets.BJ_HOST }}
          SSH_USER: ${{ secrets.BJ_USER }}
          APP_DIR: ${{ secrets.BJ_APP_DIR }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_production_sha }}
          APPROVED_BUSINESS_SHA: ${{ inputs.approved_business_sha }}
          AUTHORIZE_RELEASE_SHA: ${{ inputs.authorize_release_sha }}
        run: bash scripts/deploy-remote.sh "$SSH_HOST" "$SSH_USER" "$APP_DIR" "$GITHUB_SHA" prod

      - name: Retain exact artifact for interrupted upload recovery
        if: always() && env.RELEASE_ARTIFACT_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-staging-${{ github.sha }}
          path: ${{ env.RELEASE_ARTIFACT_PATH }}
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

      - name: Notify failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            curl -s -X POST "$WEBHOOK" -H 'Content-Type: application/json' \
              -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## BUDU 生产环境部署失败\\ncommit: $GITHUB_SHA\"}}"
          fi
