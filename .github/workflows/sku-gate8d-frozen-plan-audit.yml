name: READ_ONLY SKU Gate 8D Frozen Plan Diagnosis

on:
  push:
    branches: [codex/sku-gate8d-frozen-plan-audit]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated audit code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Checkout frozen v5 candidate
        uses: actions/checkout@v4
        with:
          repository: GPTJJ/budu
          ref: 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec
          path: candidate
          fetch-depth: 0
      - name: Verify exact candidate and audit isolation
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = GPTJJ/budu
          test "$GITHUB_REF" = refs/heads/codex/sku-gate8d-frozen-plan-audit
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C candidate rev-parse HEAD)" = 456a07ecd0c9c1ad485d27b67ccf95f3d8bd4fec
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          PYTHONDONTWRITEBYTECODE=1 python3 candidate/scripts/deploy-prod-sku-authority.py identity --repo "$PWD/candidate"
          node --check scripts/sku-gate8d-analyze.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PY'
          import ast
          ast.parse(open('scripts/sku-gate8d-readonly-audit.py').read())
          PY
      - name: Configure pinned production read-only entry
        env:
          SSH_KEY: ${{ secrets.BJ_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '154.8.195.42 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHJJGZ1Kape1om+8xOhoI7IsgvKN1tw6sh8l7PGisgtb' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Audit restored authority then isolate frozen plan failure
        env:
          BJ_HOST: ${{ secrets.BJ_HOST }}
          BJ_USER: ${{ secrets.BJ_USER }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 scripts/sku-gate8d-readonly-audit.py --candidate "$PWD/candidate"
