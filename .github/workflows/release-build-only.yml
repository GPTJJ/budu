name: NON_PRODUCTION BUILD_ONLY Approval Release Artifact

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Shipping build-only: exact reviewed engineering release SHA'
        required: true
        type: string
  push:
    branches:
      - codex/release-path-post-transfer-generalization
      - codex/release-controller-dns-empty-normalization
      - codex/release-single-writer-db-probe
      - codex/data-authority-finalization

env:
  EXPECTED_PRODUCTION_SHA: ${{ github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' && '08895d4978594ea4298c43bf72f8961cf082fca6' || github.ref == 'refs/heads/codex/data-authority-finalization' && '16faedb3afcb853a9a72434603debd4169b7ac02' || '2fa28a6399c8a9f4fd70188d8df077f0b411589e' }}
  APPROVED_BUSINESS_SHA: ${{ github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' && '48358bd774cf7d2f5da1eccb54aa4e9ccf2862fe' || github.ref == 'refs/heads/codex/data-authority-finalization' && '3722849d8566e9f6db6f45abc4195612af2957a2' || '2188dd17f6b80e9be27e50a9773e7269c6eabb65' }}

permissions:
  contents: read

concurrency:
  group: approval-release-build-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001') }}
    name: Exact Docker artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source and release guard
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-pycache
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          branch="${GITHUB_REF#refs/heads/}"
          case "$branch" in
            codex/mailing-free-tier-shipped-sort-20261001)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "${REQUESTED_RELEASE_SHA:-}" = "$GITHUB_SHA"
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_PRODUCTION_SHA" = 08895d4978594ea4298c43bf72f8961cf082fca6
              test "$APPROVED_BUSINESS_SHA" = 48358bd774cf7d2f5da1eccb54aa4e9ccf2862fe
              test "$(git rev-list --parents -n 1 "$GITHUB_SHA")" = "$GITHUB_SHA $APPROVED_BUSINESS_SHA"
              test "$(git diff --name-only "$APPROVED_BUSINESS_SHA" "$GITHUB_SHA")" = $'.github/workflows/release-build-only.yml\nscripts/test-release-path-post-transfer.py'
              ;;
            codex/release-path-post-transfer-generalization|codex/release-controller-dns-empty-normalization|codex/release-single-writer-db-probe|codex/data-authority-finalization)
              test "$GITHUB_EVENT_NAME" = push
              ;;
            *) exit 1 ;;
          esac
          test "$GITHUB_REF" = "refs/heads/$branch"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if [ -z "$(git branch --show-current)" ]; then
            git switch -c "$branch"
          fi
          test "$(git branch --show-current)" = "$branch"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'CI_SOURCE_SHA=%s RUNNER_OS=%s RUNNER_ARCH=%s\n' "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH"
          bash scripts/deploy-prod-transfer-cas.sh identity --repo "$PWD" \
            --release-profile post-transfer \
            --expected-production-sha "$EXPECTED_PRODUCTION_SHA" \
            --business-base-sha "$APPROVED_BUSINESS_SHA"
          python3 scripts/test-deploy-prod-transfer-cas.py
          python3 scripts/test-transfer-cas-existing-workflow.py
          python3 scripts/test-release-path-post-transfer.py
          python3 -m py_compile scripts/test-candidate-db-probe-integration.py
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'WORKTREE_CLEAN_AFTER_SYNTAX_CHECK=YES\n'
          docker version --format 'DOCKER_VERSION={{.Server.Version}}'
          docker buildx version

      - name: Setup Node for isolated native Approval verification
        if: github.ref == 'refs/heads/codex/data-authority-finalization'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove lifecycle races and verify repairs on PostgreSQL 16
        if: github.ref == 'refs/heads/codex/data-authority-finalization'
        shell: bash
        env:
          NODE_ENV: test
          APP_ENV: test
          TEST_APPROVAL_NATIVE_CI: '1'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node scripts/test-approval-withdraw-native-ci.mjs
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build exact production-format artifact and inspect runner image
        shell: bash
        run: |
          set -euo pipefail
          run_dir="$(mktemp -d "$RUNNER_TEMP/approval-build-only.XXXXXX")"
          printf 'RELEASE_ARTIFACT_PATH=%s/image.tar\n' "$run_dir" >> "$GITHUB_ENV"
          builder="approval-build-only-$GITHUB_RUN_ID"
          docker buildx create --name "$builder" --driver docker-container
          docker buildx inspect "$builder" --bootstrap | tee "$run_dir/builder.txt"
          grep -q 'linux/amd64' "$run_dir/builder.txt"
          mkdir "$run_dir/source"
          git archive "$GITHUB_SHA" | tar -x -C "$run_dir/source"
          printf 'BUILD_CONTEXT_SHA=%s BUILD_CONTEXT_TREE=%s\n' "$GITHUB_SHA" "$(git rev-parse "$GITHUB_SHA^{tree}")"
          timeout 35m docker buildx build --builder "$builder" --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "budu-api:post-transfer-${GITHUB_SHA:0:12}" \
            --provenance=false --sbom=false \
            --output "type=docker,compression=gzip,compression-level=9,force-compression=true,dest=$run_dir/image.tar" \
            "$run_dir/source"
          bash scripts/deploy-prod-transfer-cas.sh inspect-artifact --repo "$PWD" --archive "$run_dir/image.tar" \
            --release-profile post-transfer \
            --expected-production-sha "$EXPECTED_PRODUCTION_SHA" \
            --business-base-sha "$APPROVED_BUSINESS_SHA" \
            | tee "$run_dir/artifact.log"
          docker load --input "$run_dir/image.tar"
          tag="budu-api:post-transfer-${GITHUB_SHA:0:12}"
          image_id="$(docker image inspect "$tag" --format '{{.Id}}')"
          image_size="$(docker image inspect "$tag" --format '{{.Size}}')"
          image_platform="$(docker image inspect "$tag" --format '{{.Os}}/{{.Architecture}}')"
          image_revision="$(docker image inspect "$tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          image_repo_digests="$(docker image inspect "$tag" --format '{{json .RepoDigests}}')"
          test "$image_platform" = linux/amd64
          test "$image_revision" = "$GITHUB_SHA"
          test -n "$image_id"
          docker run --rm --network none --entrypoint cat "$tag" /app/server/approvals.js > "$run_dir/image-approvals.js"
          docker run --rm --network none --entrypoint cat "$tag" /app/server/v2.js > "$run_dir/image-v2.js"
          docker run --rm --network none --entrypoint node "$tag" --version
          if [ "$GITHUB_REF" = refs/heads/codex/mailing-free-tier-shipped-sort-20261001 ]; then
            git diff --exit-code "$APPROVED_BUSINESS_SHA" "$GITHUB_SHA" -- \
              server prisma cloudfunctions src shared Dockerfile package.json package-lock.json
            printf 'SHIPPING_BUSINESS_PAYLOAD_UNCHANGED=YES\n'
          else
          git show "$APPROVED_BUSINESS_SHA:server/approvals.js" > "$run_dir/review-approvals.js"
          git show 2fa28a6399c8a9f4fd70188d8df077f0b411589e:server/v2.js > "$run_dir/transfer-v2.js"
          approval_source_hash="$(sha256sum "$run_dir/review-approvals.js" | cut -d' ' -f1)"
          approval_image_hash="$(sha256sum "$run_dir/image-approvals.js" | cut -d' ' -f1)"
          transfer_source_hash="$(sha256sum "$run_dir/transfer-v2.js" | cut -d' ' -f1)"
          transfer_image_hash="$(sha256sum "$run_dir/image-v2.js" | cut -d' ' -f1)"
          test "$approval_source_hash" = "$approval_image_hash"
          test "$transfer_source_hash" = "$transfer_image_hash"
          git diff --exit-code "$APPROVED_BUSINESS_SHA" "$GITHUB_SHA" -- \
            server prisma cloudfunctions src shared Dockerfile package.json package-lock.json
          python3 - "$run_dir/image-approvals.js" <<'PY'
          from pathlib import Path
          import sys
          source=Path(sys.argv[1]).read_text()
          block=source.split("approvalRouter.post('/approvals/requests/:id/withdraw'",1)[1].split(
              "approvalRouter.post('/approvals/requests/:id/decide'",1)[0]
          order=('$transaction(async (tx) =>','approvalRequest.updateMany({',
                 "where: { id: request.id, status: 'pending' }",
                 'if (claimed.count !== 1)','approvalLog.create(')
          offsets=[block.index(token) for token in order]
          assert offsets == sorted(offsets)
          assert '409' in block
          print('APPROVAL_WITHDRAW_CAS_PRESENT=YES')
          PY
          printf 'APPROVAL_SOURCE_HASH=%s IMAGE_APPROVAL_HASH=%s TRANSFER_SOURCE_HASH=%s IMAGE_TRANSFER_HASH=%s\n' \
            "$approval_source_hash" "$approval_image_hash" "$transfer_source_hash" "$transfer_image_hash"
          fi
          printf 'BUILD=PASS IMAGE_ID=%s IMAGE_SIZE_BYTES=%s IMAGE_PLATFORM=%s IMAGE_REVISION=%s IMAGE_REPO_DIGESTS=%s\n' \
            "$image_id" "$image_size" "$image_platform" "$image_revision" "$image_repo_digests"
          printf 'TRANSFER_ARTIFACT_SIZE_BYTES=%s IMAGE_SMOKE=PASS\n' "$(stat -c%s "$run_dir/image.tar")"

      - name: Probe application Prisma against isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-candidate-db-probe-integration.py "budu-api:post-transfer-${GITHUB_SHA:0:12}"

      - name: Retain exact artifact for read-only preflight
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' && format('release-staging-{0}', github.sha) || format('release-preflight-{0}', github.sha) }}
          path: ${{ env.RELEASE_ARTIFACT_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
