name: NON_PRODUCTION BUILD_ONLY Approval Release Artifact

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Shipping build-only: exact reviewed engineering release SHA'
        required: true
        type: string
  push:
    branches:
      - codex/release-path-post-transfer-generalization
      - codex/release-controller-dns-empty-normalization
      - codex/release-single-writer-db-probe
      - codex/data-authority-finalization

env:
  EXPECTED_PRODUCTION_SHA: ${{ (github.ref == 'refs/heads/codex/purchase-receipt-release-20261005-ci-ready' || github.ref == 'refs/heads/codex/purchase-receipt-b1-capacity-fasttrack') && 'edb31cd398e3a330565b5453f42051f3e24005c3' || github.ref == 'refs/heads/codex/material-center-integration-20261002' && '72c780c1dbb5ff8b4502b97984d44660532f181a' || github.ref == 'refs/heads/codex/shipping-backup-diagnostic-20261002' && '68cee84efe30409e7e18e4459e08982f6c20e254' || github.ref == 'refs/heads/codex/shipping-controller-diagnostic-20261002' && '68cee84efe30409e7e18e4459e08982f6c20e254' || github.ref == 'refs/heads/codex/shipping-review-actual-quantity-20261002' && '68cee84efe30409e7e18e4459e08982f6c20e254' || github.ref == 'refs/heads/codex/natural-month-report-revision' && 'ede3ee43526a39131618287d9b5447977e5c91d3' || github.ref == 'refs/heads/codex/pos-payroll-input-shipping-baseline-20261001' && 'ba7b2bb8f83adc7fcd3d52535c15b0ecec17e531' || github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' && '08895d4978594ea4298c43bf72f8961cf082fca6' || github.ref == 'refs/heads/codex/data-authority-finalization' && '16faedb3afcb853a9a72434603debd4169b7ac02' || '2fa28a6399c8a9f4fd70188d8df077f0b411589e' }}
  APPROVED_BUSINESS_SHA: ${{ (github.ref == 'refs/heads/codex/purchase-receipt-release-20261005-ci-ready' || github.ref == 'refs/heads/codex/purchase-receipt-b1-capacity-fasttrack') && '9049339f75d106ac02ebb0d109da2862e997a545' || github.ref == 'refs/heads/codex/material-center-integration-20261002' && 'a9e9c58510af4ef38b4bcaf378ec0a77895f61bc' || github.ref == 'refs/heads/codex/shipping-backup-diagnostic-20261002' && '7a7aed7f9f4bba9514c2fd001358e6b3adf64c0c' || github.ref == 'refs/heads/codex/shipping-controller-diagnostic-20261002' && '7a7aed7f9f4bba9514c2fd001358e6b3adf64c0c' || github.ref == 'refs/heads/codex/shipping-review-actual-quantity-20261002' && '7a7aed7f9f4bba9514c2fd001358e6b3adf64c0c' || github.ref == 'refs/heads/codex/natural-month-report-revision' && '870d1d01cc2b4fca9f216f9b3decb5e565173700' || github.ref == 'refs/heads/codex/pos-payroll-input-shipping-baseline-20261001' && '27f6280f731d258ddd078504ac4a27f33430728c' || github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' && '48358bd774cf7d2f5da1eccb54aa4e9ccf2862fe' || github.ref == 'refs/heads/codex/data-authority-finalization' && '3722849d8566e9f6db6f45abc4195612af2957a2' || '2188dd17f6b80e9be27e50a9773e7269c6eabb65' }}

permissions:
  contents: read

concurrency:
  group: approval-release-build-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && ((github.ref == 'refs/heads/codex/purchase-receipt-release-20261005-ci-ready' || github.ref == 'refs/heads/codex/purchase-receipt-b1-capacity-fasttrack') || github.ref == 'refs/heads/codex/material-center-integration-20261002' || github.ref == 'refs/heads/codex/shipping-backup-diagnostic-20261002' || github.ref == 'refs/heads/codex/shipping-controller-diagnostic-20261002' || github.ref == 'refs/heads/codex/shipping-review-actual-quantity-20261002' || github.ref == 'refs/heads/codex/mailing-free-tier-shipped-sort-20261001' || github.ref == 'refs/heads/codex/pos-payroll-input-shipping-baseline-20261001' || github.ref == 'refs/heads/codex/natural-month-report-revision')) }}
    name: Exact Docker artifact validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify source and release guard
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/python-pycache
          REQUESTED_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          branch="${GITHUB_REF#refs/heads/}"
          case "$branch" in
            codex/purchase-receipt-release-20261005-ci-ready|codex/purchase-receipt-b1-capacity-fasttrack)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "${REQUESTED_RELEASE_SHA:-}" = "$GITHUB_SHA"
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_PRODUCTION_SHA" = edb31cd398e3a330565b5453f42051f3e24005c3
              test "$APPROVED_BUSINESS_SHA" = 9049339f75d106ac02ebb0d109da2862e997a545
              git fetch --no-tags origin codex/purchase-receipt-001-legacy-retirement-compat
              test "$(git rev-parse FETCH_HEAD)" = e3ecebcb94c4b058f10ad05e69a078bbc45b0d8e
              if [ "$GITHUB_REF" = refs/heads/codex/purchase-receipt-b1-capacity-fasttrack ]; then
                git merge-base --is-ancestor e762afce3053cd7ab0a7ebe9f36976ec80d3b64e "$GITHUB_SHA"
                test "$GITHUB_SHA" != e762afce3053cd7ab0a7ebe9f36976ec80d3b64e
                test -z "$(git rev-list --merges e762afce3053cd7ab0a7ebe9f36976ec80d3b64e.."$GITHUB_SHA")"
                python3 - <<'PY_SCOPE'
          import subprocess
          allowed = {'.github/workflows/release-build-only.yml',
                     'scripts/deploy-prod-transfer-cas.py',
                     'scripts/test-purchase-receipt-release-contract.py',
                     'scripts/test-release-path-post-transfer.py',
                     'scripts/test-candidate-db-probe-integration.py'}
          changed = set(filter(None, subprocess.check_output(['git', 'log',
              '--format=', '--name-only',
              'e762afce3053cd7ab0a7ebe9f36976ec80d3b64e..HEAD'], text=True).splitlines()))
          if not changed or not changed <= allowed:
              raise SystemExit('B1_CI_SCOPE_INVALID')
          PY_SCOPE
              else
                test "$(git rev-list --parents -n 1 "$GITHUB_SHA")" = "$GITHUB_SHA $APPROVED_BUSINESS_SHA"
              fi
              ;;
            codex/material-center-integration-20261002)
              test "$GITHUB_EVENT_NAME" = workflow_dispatch
              test "${REQUESTED_RELEASE_SHA:-}" = "$GITHUB_SHA"
              [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$EXPECTED_PRODUCTION_SHA" = 72c780c1dbb5ff8b4502b97984d44660532f181a
              test "$APPROVED_BUSINESS_SHA" = a9e9c58510af4ef38b4bcaf378ec0a77895f61bc
              test "$(git rev-list --parents -n 1 "$GITHUB_SHA")" = "$GITHUB_SHA f2a76c01eb62f50a344e0e0c34be37a581a0796c"
              test "$(git rev-list --parents -n 1 f2a76c01eb62f50a344e0e0c34be37a581a0796c)" = "f2a76c01eb62f50a344e0e0c34be37a581a0796c e4d2859b7c85a0a76a3360acb891e90bb10e6b48"
