              test "$(git diff --name-only e4d2859b7c85a0a76a3360acb891e90bb10e6b48 f2a76c01eb62f50a344e0e0c34be37a581a0796c)" = $'.github/workflows/release-build-only.yml\nscripts/deploy-prod-transfer-cas.py\nscripts/release-prod-post-transfer-ci.sh\nscripts/test-candidate-db-probe-integration.py\nscripts/test-material-release-contract.py'
              test "$(git diff --name-only f2a76c01eb62f50a344e0e0c34be37a581a0796c "$GITHUB_SHA")" = $'.github/workflows/release-build-only.yml\nscripts/deploy-prod-transfer-cas.py\nscripts/test-candidate-db-probe-integration.py\nscripts/test-material-release-contract.py'
