name: CI

# 独立质量门禁：仅验证代码质量（npm ci → test → test:critical → build）
# 与部署完全分离：不触发任何 SSH / Docker / Migration / Deploy 动作
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 最小权限：仅读取仓库内容

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # 与 Dockerfile（node:22-alpine）一致，严格复用生产版本
          cache: npm # 基于 package-lock.json 的官方 npm 缓存（不缓存 node_modules）

      - name: Install dependencies
        run: npm ci # 严格按 lockfile 安装；不使用 npm install

      - name: Run unified tests
        run: npm run test

      - name: Run critical tests
        run: npm run test:critical

      - name: Build
        run: npm run build
