services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-budu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budu_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-budu}
    volumes:
      - budu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budu} -d ${POSTGRES_DB:-budu}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: budu-api:latest
    container_name: budu-api-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    volumes:
      - budu_data:/app/server/data

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      HTTP_ONLY: ${HTTP_ONLY:-0}
    volumes:
      - ./deploy/nginx/entrypoint.sh:/docker-entrypoint.d/40-budu-conf.sh:ro
      - ./deploy/nginx/conf.d:/etc/nginx/budu:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx

volumes:
  budu_data:
  nginx_logs:
  budu_pgdata:
