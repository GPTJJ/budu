<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Mailing Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import StoreMailingPage from '/src/components/StoreMailingPage.jsx'
    import '/src/index.css'

    const records = []
    window.fetch = async (url, options = {}) => {
      const path = new URL(url, location.origin).pathname
      const json = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } }))
      if (path === '/api/v2/mailing-records' && (!options.method || options.method === 'GET')) {
        return json({ rows: records })
      }
      if (path === '/api/v2/mailing-records' && options.method === 'POST') {
        const body = JSON.parse(options.body)
        records.push({ id: 'm-' + records.length, ...body, status: 'pending', createdAt: new Date().toISOString() })
        return json({ ok: true, record: records[records.length - 1] }, 201)
      }
      return json({ error: `未模拟接口 ${path}` }, 404)
    }

    createRoot(document.getElementById('root')).render(React.createElement(StoreMailingPage, { onBack: () => {} }))
  </script></body>
</html>
