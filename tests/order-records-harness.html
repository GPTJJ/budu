<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Order Records Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import OrderRecordsPage from '/src/components/OrderRecordsPage.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    localStorage.setItem('budu-os-cloud-mirror-v1', JSON.stringify({
      entries: {}, staff: [], stores: [{ key: 'store-1', name: '测试门店' }], schedules: {}, products: [], inventoryRequests: [], inventory: [], analysis: {}, productImages: {},
    }))
    seedCachedDataForTest(JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')))

    const orders = [
      {
        id: 'order-1', orderNo: 'POS-TEST-ORDER-001', storeId: 'store-1', storeName: '测试门店',
        cashierId: 'user-1', cashierNameSnapshot: '测试收银员', subtotal: '7200', discountAmount: '0', payableAmount: '7200',
        status: 'completed', paymentStatus: 'paid', paymentMethod: 'cash', paymentMode: 'cash',
        createdAt: '2026-08-11T03:00:00.000Z', updatedAt: '2026-08-11T03:00:00.000Z', completedAt: '2026-08-11T03:00:05.000Z',
        payments: [{ id: 'pay-1', paymentNo: 'PAY-TEST-1', channel: 'cash', amount: '7200', status: 'success', paidAt: '2026-08-11T03:00:05.000Z', createdAt: '2026-08-11T03:00:00.000Z' }],
        refunds: [],
        items: [{ id: 'oi-1', productId: 'p-1', productNameSnapshot: '卡皮巴拉布丁', skuSnapshot: 'BUDU-001', unitPrice: '7200', quantity: 1, lineAmount: '7200' }],
      },
      {
        id: 'order-2', orderNo: 'POS-TEST-ORDER-002', storeId: 'store-1', storeName: '测试门店',
        cashierId: 'user-1', cashierNameSnapshot: '测试收银员', subtotal: '10200', discountAmount: '0', payableAmount: '10200',
        status: 'pending_payment', paymentStatus: 'unpaid', paymentMethod: null, paymentMode: 'mock',
        createdAt: '2026-08-11T04:00:00.000Z', updatedAt: '2026-08-11T04:00:00.000Z', completedAt: null,
        payments: [], refunds: [],
        items: [{ id: 'oi-2', productId: 'p-2', productNameSnapshot: '草莓奶油蛋糕', skuSnapshot: 'BUDU-002', unitPrice: '3800', quantity: 2, lineAmount: '7600' }, { id: 'oi-3', productId: 'p-3', productNameSnapshot: '蓝莓酸奶杯', skuSnapshot: 'BUDU-003', unitPrice: '2600', quantity: 1, lineAmount: '2600' }],
      },
      {
        id: 'order-3', orderNo: 'POS-TEST-ORDER-003', storeId: 'store-1', storeName: '测试门店',
        cashierId: 'user-1', cashierNameSnapshot: '测试收银员', subtotal: '18200', discountAmount: '0', payableAmount: '18200',
        status: 'completed', paymentStatus: 'paid', paymentMethod: 'wechat', paymentMode: 'wechat_pay',
        createdAt: '2026-08-11T05:00:00.000Z', updatedAt: '2026-08-11T05:00:00.000Z', completedAt: '2026-08-11T05:00:05.000Z',
        payments: [{ id: 'pay-3', paymentNo: 'PAY-TEST-3', channel: 'wechat', provider: 'wechat_pay', amount: '18200', status: 'success', paidAt: '2026-08-11T05:00:05.000Z', createdAt: '2026-08-11T05:00:00.000Z' }],
        refunds: [],
        items: [{ id: 'oi-4', productId: 'p-1', productNameSnapshot: '卡皮巴拉布丁', skuSnapshot: 'BUDU-001', unitPrice: '7200', quantity: 2, lineAmount: '14400' }, { id: 'oi-5', productId: 'p-2', productNameSnapshot: '草莓奶油蛋糕', skuSnapshot: 'BUDU-002', unitPrice: '3800', quantity: 1, lineAmount: '3800' }],
      },
    ]

    const testParams = new URLSearchParams(location.search)
    if (testParams.get('deletable') === '1') {
      orders[1].status = 'failed'
      orders[1].paymentStatus = 'failed'
    }

    window.fetch = async (url, options = {}) => {
      const path = new URL(url, location.origin).pathname
      const json = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } }))
      if (path === '/api/v2/pos/orders') {
        const qs = new URL(url, location.origin).searchParams
        window.__lastOrderQuery = Object.fromEntries(qs.entries())
        const filtered = orders.filter((order) => {
          if (qs.get('paymentMethod') && order.paymentMethod !== qs.get('paymentMethod')) return false
          if (qs.get('status') && order.status !== qs.get('status')) return false
          if (!qs.get('status') && order.status === 'cancelled') return false
          if (qs.get('q') && !order.orderNo.toLowerCase().includes(qs.get('q').toLowerCase())) return false
          return true
        })
        const paid = filtered.filter((order) => order.paymentStatus === 'paid' && ['paid', 'completed'].includes(order.status) && (order.payments || []).some((payment) => payment.status === 'success') && (order.refunds || []).length === 0)
        const grossAmount = paid.reduce((sum, order) => sum + Number(order.payableAmount), 0)
        const refundAmount = filtered.reduce((sum, order) => sum + (order.refunds || [])
          .filter((refund) => refund.status === 'completed')
          .reduce((inner, refund) => inner + Number(refund.amount), 0), 0)
        const soldQuantity = paid.reduce((sum, order) => sum + order.items.reduce((inner, item) => inner + item.quantity, 0), 0)
        const collectedAmount = grossAmount
        return json({
          ok: true,
          total: filtered.length,
          summary: {
            recordCount: filtered.length,
            paidOrderCount: paid.length,
            collectedAmount: String(collectedAmount),
            grossAmount: String(grossAmount),
            refundAmount: String(refundAmount),
            discountAmount: String(paid.reduce((sum, order) => sum + Number(order.discountAmount), 0)),
            itemQuantity: soldQuantity,
            averageAmount: String(paid.length ? Math.floor(collectedAmount / paid.length) : 0),
          },
          rows: filtered,
        })
      }
      const cancelMatch = path.match(/^\/api\/v2\/pos\/orders\/(.+)\/cancel$/)
      if (cancelMatch && options.method === 'POST') {
        const id = decodeURIComponent(cancelMatch[1])
        const order = orders.find((item) => item.id === id)
        if (!order) return json({ error: '订单不存在' }, 404)
        const body = JSON.parse(options.body)
        window.__cancelledOrders = [...(window.__cancelledOrders || []), { id, reason: body.reason }]
        order.status = 'cancelled'
        order.cancelReason = body.reason
        order.cancelledBy = 'dev'
        order.cancelledAt = new Date().toISOString()
        return json({ ok: true, order })
      }
      const deleteMatch = path.match(/^\/api\/v2\/pos\/orders\/(.+)$/)
      if (deleteMatch && options.method === 'DELETE') {
        const id = decodeURIComponent(deleteMatch[1])
        window.__deletedOrderIds = [...(window.__deletedOrderIds || []), id]
        const index = orders.findIndex((order) => order.id === id)
        if (index === -1) return json({ error: '订单不存在' }, 404)
        orders.splice(index, 1)
        return json({ ok: true })
      }
      const refundMatch = path.match(/^\/api\/v2\/pos\/orders\/(.+)\/refunds$/)
      if (refundMatch && options.method === 'POST') {
        const id = decodeURIComponent(refundMatch[1])
        const order = orders.find((item) => item.id === id)
        if (!order) return json({ error: '订单不存在' }, 404)
        const body = JSON.parse(options.body)
        const refundedBefore = (order.refunds || []).filter((r) => r.status === 'completed').reduce((sum, r) => sum + Number(r.amount), 0)
        const items = body.items && body.items.length
          ? body.items.map((row) => {
            const orderItem = order.items.find((item) => item.id === row.orderItemId)
            return { id: `ri-${row.orderItemId}`, orderItemId: row.orderItemId, productName: orderItem.productNameSnapshot, quantity: row.quantity, amountCents: String(Number(orderItem.unitPrice) * row.quantity) }
          })
          : order.items.map((orderItem) => ({ id: `ri-all-${orderItem.id}`, orderItemId: orderItem.id, productName: orderItem.productNameSnapshot, quantity: orderItem.quantity, amountCents: orderItem.lineAmount }))
        const amount = String(items.reduce((sum, item) => sum + Number(item.amountCents), 0))
        const fully = Number(amount) >= Number(order.payableAmount) - refundedBefore
        const refund = {
          id: `ref-${Date.now()}`, refundNo: 'RF-TEST-' + Date.now(), orderId: order.id, paymentId: (order.payments[0] || {}).id || '',
          amount, reason: body.reason || '', status: 'completed', providerRefundNo: 'LOCALRF-TEST',
          requestedBy: 'dev', approvedBy: 'dev', createdAt: new Date().toISOString(), completedAt: new Date().toISOString(), items,
        }
        order.refunds = [...(order.refunds || []), refund]
        order.status = fully ? 'refunded' : 'partially_refunded'
        order.paymentStatus = fully ? 'refunded' : 'partially_refunded'
        return json({ ok: true, refund, order }, 201)
      }
      return json({ error: `未模拟接口 ${path}` }, 404)
    }

    createRoot(document.getElementById('root')).render(React.createElement(OrderRecordsPage, {
      user: { id: 'user-1', username: 'dev', role: testParams.get('role') || 'developer', storeKeys: ['store-1'] },
      onBack: () => {},
      onPay: (order) => { window.__payOrder = { id: order.id, orderNo: order.orderNo } },
    }))
  </script></body>
</html>
