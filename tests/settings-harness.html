<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Settings Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import SettingsPage from '/src/components/SettingsPage.jsx'
    import { OverlayStackManager } from '/src/components/overlay/OverlayPrimitives.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    localStorage.setItem('budu-os-cloud-mirror-v1', JSON.stringify({
      entries: {}, staff: [], removedStaff: [], analysis: {}, productImages: {},
      stores: [], schedules: {}, products: [], inventoryRequests: [], inventory: [],
      bigBonuses: [], dailyPayAdjustments: [], posDaily: [], posProductSales: [],
    }))
    seedCachedDataForTest(JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')))

    const role = new URLSearchParams(location.search).get('role') || 'developer'
    createRoot(document.getElementById('root')).render(React.createElement(React.Fragment, null,
      React.createElement(OverlayStackManager),
      React.createElement('main', { className: 'mx-auto max-w-5xl p-3 sm:p-4' },
        React.createElement(SettingsPage, {
          user: { id: `${role}-1`, username: role, role },
          onBack: () => { document.documentElement.dataset.back = 'true' },
        }),
      ),
    ))
  </script></body>
</html>
