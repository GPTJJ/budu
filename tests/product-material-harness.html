<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Product Material Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import ProductMaterialManagementPage from '/src/components/ProductMaterialManagementPage.jsx'
    import '/src/index.css'

    const categories = [
      { id: 'c-candy', name: '糖果', sortOrder: 1, isActive: true, version: 1, productCount: 1 },
      { id: 'c-gift', name: '礼盒', sortOrder: 2, isActive: false, version: 1, productCount: 0 },
    ]
    const rows = [
      { id: 'p-used', category: 'product', name: 'NO.1树莓', code: 'NO.1', enabled: true, sortOrder: 1, productCategoryId: 'c-candy', productCategory: categories[0], version: 1, used: true },
      { id: 'p-off', category: 'product', name: '旧产品', code: 'OLD', enabled: false, sortOrder: 9, productCategoryId: '', productCategory: null, version: 1, used: false },
      { id: 'p-zero', category: 'product', name: '0.1元-补价用', code: 'PRICE', enabled: true, sortOrder: 10, productCategoryId: '', productCategory: null, version: 1, used: false },
      { id: 'm-used', category: 'material', name: '冰袋', code: '', enabled: true, sortOrder: 1, version: 1, used: true },
    ]
    const requests = []
    window.__productMaterialTest = { rows, categories, requests }
    window.fetch = async (url, options = {}) => {
      const path = new URL(url, location.origin).pathname
      const method = options.method || 'GET'
      const json = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } }))
      if (path === '/api/v2/transfer-master-items' && method === 'GET') return json({ rows })
      if (path === '/api/v2/product-categories' && method === 'GET') return json({ rows: categories })
      if (path === '/api/v2/product-categories' && method === 'POST') {
        const body = JSON.parse(options.body); requests.push({ method, path, body })
        const category = { ...body, id: `category-${categories.length}`, version: 1, productCount: 0 }
        categories.push(category); return json({ ok: true, category }, 201)
      }
      const categoryUpdate = path.match(/^\/api\/v2\/product-categories\/([^/]+)$/)
      if (categoryUpdate && method === 'PUT') {
        const body = JSON.parse(options.body); requests.push({ method, path, body })
        const index = categories.findIndex((category) => category.id === categoryUpdate[1])
        categories[index] = { ...categories[index], ...body, sortOrder: Number(body.sortOrder), version: categories[index].version + 1 }
        return json({ ok: true, category: categories[index] })
      }
      if (path === '/api/v2/transfer-master-items' && method === 'POST') {
        const body = JSON.parse(options.body); requests.push({ method, path, body })
        const productCategory = categories.find((category) => category.id === body.productCategoryId) || null
        const item = { ...body, productCategory, id: `new-${rows.length}`, version: 1, used: false }
        rows.push(item); return json({ ok: true, item }, 201)
      }
      if (path === '/api/v2/transfer-master-items/bulk-category' && method === 'PUT') {
        const body = JSON.parse(options.body); requests.push({ method, path, body })
        const category = categories.find((row) => row.id === body.productCategoryId) || null
        for (const item of rows.filter((row) => body.ids.includes(row.id))) { item.productCategoryId = body.productCategoryId || ''; item.productCategory = category; item.version += 1 }
        return json({ ok: true, updated: body.ids.length })
      }
      const update = path.match(/^\/api\/v2\/transfer-master-items\/([^/]+)$/)
      if (update && method === 'PUT') {
        const body = JSON.parse(options.body); requests.push({ method, path, body })
        const index = rows.findIndex((item) => item.id === update[1])
        const productCategory = categories.find((category) => category.id === body.productCategoryId) || null
        rows[index] = { ...rows[index], ...body, productCategory, version: rows[index].version + 1 }
        return json({ ok: true, item: rows[index] })
      }
      return json({ error: `未模拟接口 ${method} ${path}` }, 404)
    }
    createRoot(document.getElementById('root')).render(React.createElement(ProductMaterialManagementPage, { onBack: () => {} }))
  </script></body>
</html>
