<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Gate 24 Payroll Display Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import PersonnelPage from '/src/components/PersonnelPage.jsx'
    import { PublicModeProvider } from '/src/visibility.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    // 测试窗口：拦截 daily-store-staff（按月返回 fixture 考勤行）与 staff-list
    window.__origFetch = window.fetch
    window.fetch = (url, opts = {}) => {
      const u = String(url)
      const json = (body) => Promise.resolve(new Response(JSON.stringify(body), { status: 200, headers: { 'Content-Type': 'application/json' } }))
      if (u.includes('/api/v2/daily-store-staff')) {
        const month = new URL(u, location.origin).searchParams.get('month')
        const rows = (window.__attendanceByMonth || {})[month] || []
        return json({ ok: true, month, rows })
      }
      if (u.includes('/api/v2/staff-list') && (opts.method || 'GET') === 'GET') {
        return json({ ok: true, rows: window.__staff || [] })
      }
      if (u.includes('/api/v2/employees/backfill') || u.includes('/api/v2/staff') || u.includes('/api/v2/daily-entries')) {
        return json({ ok: true })
      }
      return window.__origFetch(url, opts)
    }

    function seed({ staff, entries, attendanceByMonth }) {
      window.__staff = staff
      window.__attendanceByMonth = attendanceByMonth || {}
      seedCachedDataForTest({
        entries: entries || {},
        staff,
        removedStaff: [],
        stores: [{ key: 'guanshe', name: '北京官舍店' }],
        schedules: {},
        products: [],
        inventoryRequests: [],
        inventory: [],
        analysis: {},
        productImages: {},
        bigBonuses: [],
        dailyPayAdjustments: [],
        posDaily: [],
        posProductSales: [],
      })
    }
    window.__seed = seed

    const isLegacy = new URLSearchParams(location.search).get('legacy') === '1'
    seed({
      staff: [
        { id: 'emp-A', name: '张伟', storeKey: 'guanshe', storeName: '北京官舍店', type: 'fulltime', employeeNo: 'A001' },
        { id: 'emp-B', name: '张伟', storeKey: 'guanshe', storeName: '北京官舍店', type: 'parttime', employeeNo: 'B001' },
      ],
      entries: { '2026-08|guanshe|08-01': { inc: 12000, ord: 120, staff: ['张伟', '张伟'] } },
      attendanceByMonth: isLegacy
        ? { '2026-08': [] }
        : {
            '2026-08': [
              { id: 'a1', storeId: 'guanshe', storeKey: 'guanshe', date: '2026-08-01', employeeId: 'emp-A', staffId: 'st-a', staffNameSnapshot: '张伟', actualHours: 8 },
              { id: 'a2', storeId: 'guanshe', storeKey: 'guanshe', date: '2026-08-01', employeeId: 'emp-B', staffId: 'st-b', staffNameSnapshot: '张伟', actualHours: 8 },
            ],
          },
    })

    createRoot(document.getElementById('root')).render(
      React.createElement(PublicModeProvider, { isPublic: false, isStore: false },
        React.createElement(PersonnelPage, {
          user: { id: 'dev-1', username: 'developer', role: 'developer' },
          canDelete: true,
          canManage: true,
          onBack: () => {},
          onOpenProfile: () => {},
        }),
      ),
    )
  </script></body>
</html>
