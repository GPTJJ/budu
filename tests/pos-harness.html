<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>BUDU POS iPad Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import PosPage from '/src/components/PosPage.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    const userId = new URLSearchParams(location.search).get('user') || 'user-test'
    const params = new URLSearchParams(location.search)
    const scannedCodes = (params.get('codes') || '134567890123456789').split(',')
    const cameraMode = params.get('camera') || 'ok'
    const scanDelay = Number(params.get('scanDelay') || 20)
    const duplicateScan = params.get('duplicate') === '1'
    const payMode = params.get('paymode') || 'success'
    // R2：双门店（验证 POS 配置按当前门店拉取）与过期配置响应（验证门店切换丢弃旧响应）
    const twoStores = params.get('stores') === '2'
    const configStale = params.get('configStale') === '1'
    const storeKeys = twoStores ? ['test-store', 'store-2'] : ['test-store']
    let scanIndex = 0
    window.__paymentRequestCount = 0
    window.__cameraTrackStops = 0
    window.__cameraStarts = 0
    window.__posConfigRequests = []

    Object.defineProperty(HTMLMediaElement.prototype, 'srcObject', { configurable: true, get() { return this.__srcObject || null }, set(value) { this.__srcObject = value } })
    HTMLMediaElement.prototype.play = async function () {}
    HTMLMediaElement.prototype.pause = function () {}
    Object.defineProperty(navigator, 'mediaDevices', {
      configurable: true,
      value: {
        getUserMedia: async () => {
          window.__cameraStarts += 1
          if (cameraMode === 'denied') { const error = new Error('denied'); error.name = 'NotAllowedError'; throw error }
          if (cameraMode === 'missing') { const error = new Error('missing'); error.name = 'NotFoundError'; throw error }
          const track = { stop() { window.__cameraTrackStops += 1 } }
          return { getTracks: () => [track], getVideoTracks: () => [track] }
        },
      },
    })
    const scannerDecoderFactory = async () => {
      let timer = 0
      let stopped = false
      return {
        async start({ onResult }) {
          const code = scannedCodes[Math.min(scanIndex, scannedCodes.length - 1)]
          scanIndex += 1
          timer = window.setTimeout(() => {
            if (stopped) return
            onResult(code)
            if (duplicateScan) onResult(code)
          }, scanDelay)
          return { stop() { stopped = true; window.clearTimeout(timer) } }
        },
        stop() { stopped = true; window.clearTimeout(timer) },
      }
    }
    const products = [
      { productId: 'p-1', name: '卡皮巴拉布丁', sku: 'BUDU-001', barcode: '690000000001', posCategory: '布丁', salePriceCents: '7200', costPriceCents: '2300', unit: '份', image: '', isActive: true, trackInventory: false, sortOrder: 1, version: 1 },
      { productId: 'p-2', name: '草莓奶油蛋糕', sku: 'BUDU-002', barcode: '690000000002', posCategory: '蛋糕', salePriceCents: '3800', costPriceCents: '1200', unit: '块', image: '', isActive: true, trackInventory: false, sortOrder: 2, version: 1 },
      { productId: 'p-3', name: '蓝莓酸奶杯', sku: 'BUDU-003', barcode: '', posCategory: '饮品', salePriceCents: '2600', costPriceCents: '900', unit: '杯', image: '', isActive: true, trackInventory: false, sortOrder: 3, version: 1 },
      { productId: 'p-4', name: '法式海盐焦糖巧克力千层蛋糕', sku: 'BUDU-004', barcode: '690000000004', posCategory: '蛋糕', salePriceCents: '4500', costPriceCents: '1600', unit: '块', image: '', isActive: true, trackInventory: false, sortOrder: 4, version: 1 },
    ]
    const mirrorStores = [{ key: 'test-store', name: '测试门店' }]
    if (twoStores) mirrorStores.push({ key: 'store-2', name: '第二门店' })
    localStorage.setItem('budu-os-cloud-mirror-v1', JSON.stringify({ entries: {}, staff: [], stores: mirrorStores, schedules: {}, products: [], inventoryRequests: [], inventory: [], analysis: {}, productImages: {} }))
    seedCachedDataForTest(JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')))
    let order = JSON.parse(sessionStorage.getItem('__budu-pos-test-order') || 'null')
    let payment = JSON.parse(sessionStorage.getItem('__budu-pos-test-payment') || 'null')
    window.fetch = async (url, options = {}) => {
      const path = new URL(url, location.origin).pathname
      const json = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } }))
      if (path === '/api/v2/pos/config') {
        const storeId = new URL(url, location.origin).searchParams.get('storeId') || ''
        window.__posConfigRequests.push({ storeId, at: Date.now() })
        if (configStale) {
          // store-2：未授权微信 → 仅现金，立即返回；store-1：慢 300ms 返回（过期响应场景）
          const respond = () => json(storeId === 'store-2'
            ? { mode: 'mock', mock: true, channels: ['cash'] }
            : { mode: 'mock', mock: true, channels: ['wechat', 'alipay', 'cash'] })
          if (storeId === 'store-2') return respond()
          return new Promise((resolve) => setTimeout(() => resolve(respond()), 300))
        }
        const live = params.get('posmode') === 'live'
        return json(live
          ? { mode: 'live', mock: false, channels: ['cash'] }
          : { mode: 'mock', mock: true, channels: ['wechat', 'alipay', 'cash'] })
      }
      if (path === '/api/v2/pos/products') return json({ rows: products })
      if (path === '/api/v2/pos/orders' && options.method === 'POST') {
        const body = JSON.parse(options.body)
        const items = body.items.map((row) => {
          const p = products.find((pp) => pp.productId === row.productId)
          const gift = row.gift === true
          const unitPrice = p.salePriceCents
          return { id: `oi-${row.productId}`, productId: row.productId, productNameSnapshot: p.name, skuSnapshot: p.sku, unitPrice, quantity: row.quantity, lineAmount: gift ? '0' : String(Number(unitPrice) * row.quantity), isGift: gift }
        })
        const subtotal = items.reduce((sum, item) => sum + Number(item.unitPrice) * item.quantity, 0)
        const chargeable = items.reduce((sum, item) => sum + Number(item.lineAmount), 0)
        const discountPercent = Number(body.discountPercent ?? 100)
        const payable = Math.round((chargeable * discountPercent) / 100)
        order = { id: `order-${userId}`, orderNo: `POS-TEST-${userId}`, storeId: body.storeId, storeName: '测试门店', cashierId: userId, cashierNameSnapshot: userId, subtotal: String(subtotal), discountAmount: String(subtotal - payable), payableAmount: String(payable), discountPercent, remark: body.remark || '', status: 'pending_payment', paymentStatus: 'unpaid', paymentMethod: null, paymentMode: 'mock', checkoutKey: body.checkoutKey, items, payments: [] }
        sessionStorage.setItem('__budu-pos-test-order', JSON.stringify(order))
        return json({ ok: true, order }, 201)
      }
      if (path === '/api/v2/pos/orders' && (!options.method || options.method === 'GET')) {
        const rows = order ? [order] : []
        return json({ ok: true, total: rows.length, rows })
      }
      if (order && path === `/api/v2/pos/orders/${order.id}` && options.method !== 'POST') return json({ order: { ...order, payments: payment ? [payment] : [] } })
      if (order && path === `/api/v2/pos/orders/${order.id}/payments`) {
        const body = JSON.parse(options.body)
        window.__paymentRequestCount += 1
        if (['wechat', 'alipay'].includes(body.channel) && !body.authCode) return json({ error: '请扫描有效的顾客付款码' }, 400)
        const failed = String(body.authCode || '').startsWith('FAIL')
        const pending = payMode === 'pending' && ['wechat', 'alipay'].includes(body.channel)
        payment = { id: `payment-${userId}-${window.__paymentRequestCount}`, paymentNo: `PAY-${userId}-${window.__paymentRequestCount}`, orderId: order.id, channel: body.channel, amount: order.payableAmount, currency: 'CNY', status: pending ? 'pending' : failed ? 'failed' : 'success', merchantTradeNo: `MT-${userId}-${window.__paymentRequestCount}`, providerTradeNo: `MOCK-${userId}-${window.__paymentRequestCount}`, provider: 'mock', callbackCount: 1, failureMessage: failed ? '模拟支付失败，请重新扫码' : '' }
        order = pending
          ? { ...order, status: 'pending_payment', paymentStatus: 'pending', paymentMethod: null, payments: [payment] }
          : failed
          ? { ...order, status: 'pending_payment', paymentStatus: 'failed', paymentMethod: null, payments: [payment] }
          : { ...order, status: 'completed', paymentStatus: 'paid', paymentMethod: body.channel, completedAt: new Date().toISOString(), payments: [payment] }
        sessionStorage.setItem('__budu-pos-test-order', JSON.stringify(order))
        sessionStorage.setItem('__budu-pos-test-payment', JSON.stringify(payment))
        return json({ ok: true, payment, order }, 201)
      }
      if (order && payment && path === `/api/v2/pos/payments/${payment.id}/query` && options.method === 'POST') {
        return json({ payment, order })
      }
      if (order && payment && path === `/api/v2/pos/payments/${payment.id}/close` && options.method === 'POST') {
        payment = { ...payment, status: 'closed', failureMessage: '' }
        order = { ...order, paymentStatus: 'unpaid', payments: [payment] }
        sessionStorage.setItem('__budu-pos-test-order', JSON.stringify(order))
        sessionStorage.setItem('__budu-pos-test-payment', JSON.stringify(payment))
        return json({ payment, order })
      }
      return json({ error: `未模拟接口 ${path}` }, 404)
    }
    window.__posExitCount = 0
    createRoot(document.getElementById('root')).render(React.createElement(PosPage, { user: { id: userId, username: userId, role: 'staff', storeKeys }, onExit: () => { window.__posExitCount += 1 }, scannerDecoderFactory }))
  </script></body>
</html>
