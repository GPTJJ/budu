<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" /><title>budu 甜意卡管理测试</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import SweetCardPage from '/src/components/SweetCardPage.jsx'
    import '/src/index.css'

    const now = '2026-09-05T04:30:00.000Z'
    const commercialBatch = {
      id: 'batch-commercial', name: 'BUDU-SC-202609-A01', businessPurpose: 'COMMERCIAL', archivedAt: null,
      cardCount: 7, faceValueCents: '20000', carrierType: 'ELECTRONIC', bindingMode: 'REQUIRED',
      metrics: { activated: 1, consumedCents: '0', balanceCents: '140000' },
    }
    const acceptanceBatch = {
      id: 'batch-acceptance', name: 'P19-验收事实', businessPurpose: 'ACCEPTANCE_TEST', archivedAt: null,
      cardCount: 1, faceValueCents: '50000', carrierType: 'PHYSICAL', bindingMode: 'NONE',
      metrics: { activated: 0, consumedCents: '0', balanceCents: '50000' },
    }
    const archivedCommercialBatch = {
      id: 'batch-archived-commercial', name: '历史商业批次', businessPurpose: 'COMMERCIAL', archivedAt: now,
      cardCount: 1, faceValueCents: '30000', carrierType: 'ELECTRONIC', bindingMode: 'OPTIONAL',
      metrics: { activated: 0, consumedCents: '0', balanceCents: '30000' },
    }
    const archivedAcceptanceBatch = {
      id: 'batch-archived-acceptance', name: '历史验收批次', businessPurpose: 'ACCEPTANCE_TEST', archivedAt: now,
      cardCount: 1, faceValueCents: '10000', carrierType: 'PHYSICAL', bindingMode: 'NONE',
      metrics: { activated: 0, consumedCents: '0', balanceCents: '10000' },
    }
    const batches = [commercialBatch, acceptanceBatch, archivedCommercialBatch, archivedAcceptanceBatch]
    const statuses = ['CREATED', 'ACTIVE', 'FROZEN', 'LOST', 'EXHAUSTED', 'EXPIRED', 'VOID']
    const cards = statuses.map((status, index) => ({
      id: `card-${status.toLowerCase()}`, publicCardNo: `SC-UI-${String(index + 1).padStart(2, '0')}`,
      batchId: commercialBatch.id, initialAmountCents: '20000', balanceCents: status === 'EXHAUSTED' ? '0' : '20000', status,
      carrierType: index % 2 === 0 ? 'ELECTRONIC' : 'PHYSICAL',
      bindingMode: index % 3 === 0 ? 'NONE' : index % 3 === 1 ? 'OPTIONAL' : 'REQUIRED',
      recipientLabel: index === 0 ? '西单商业客户' : '', recipientCompany: '',
      recipientType: index === 0 ? '个人' : '', recipientNote: index === 0 ? '愿每一天都有一点甜。' : '',
      giftingScenario: index === 0 ? '商务赠礼' : '', activatedAt: status === 'ACTIVE' ? now : null,
    }))
    cards.push(
      { id: 'card-acceptance', publicCardNo: 'SC-ACCEPTANCE-01', batchId: acceptanceBatch.id, initialAmountCents: '50000', balanceCents: '50000', status: 'CREATED', carrierType: 'ELECTRONIC', bindingMode: 'NONE', recipientLabel: '', recipientCompany: '' },
      { id: 'card-archived-commercial', publicCardNo: 'SC-ARCHIVED-COMMERCIAL', batchId: archivedCommercialBatch.id, initialAmountCents: '30000', balanceCents: '30000', status: 'CREATED', carrierType: 'ELECTRONIC', bindingMode: 'OPTIONAL', recipientLabel: '', recipientCompany: '' },
      { id: 'card-archived-acceptance', publicCardNo: 'SC-ARCHIVED-ACCEPTANCE', batchId: archivedAcceptanceBatch.id, initialAmountCents: '10000', balanceCents: '10000', status: 'CREATED', carrierType: 'PHYSICAL', bindingMode: 'NONE', recipientLabel: '', recipientCompany: '' },
    )

    const scopedBatches = (requestUrl) => {
      const purpose = requestUrl.searchParams.get('businessPurpose') || 'COMMERCIAL'
      const archived = requestUrl.searchParams.get('archived') === 'true'
      return batches.filter((batch) => Boolean(batch.archivedAt) === archived && (purpose === 'ALL' || batch.businessPurpose === purpose))
    }
    const scopedCards = (requestUrl) => {
      const ids = new Set(scopedBatches(requestUrl).map((batch) => batch.id))
      return cards.filter((card) => ids.has(card.batchId))
    }
    const overview = (requestUrl) => {
      const rows = scopedCards(requestUrl)
      return {
        count: rows.length, issued: rows.length,
        initialAmountCents: rows.reduce((sum, card) => sum + BigInt(card.initialAmountCents), 0n).toString(),
        balanceCents: rows.reduce((sum, card) => sum + BigInt(card.balanceCents), 0n).toString(),
        statusCounts: Object.fromEntries(statuses.map((status) => [status, rows.filter((card) => card.status === status).length])),
      }
    }

    window.__lastSweetCardBatchBody = null
    window.__presentationUpdates = []
    window.__claimPresentationBodies = []
    window.__claimPresentationResponse = { mode: 'success', delayMs: 0 }
    window.__setClaimPresentationResponse = (next) => { window.__claimPresentationResponse = { ...window.__claimPresentationResponse, ...next } }
    window.__deliveryActions = []
    window.__setA75CardState = ({ card: cardPatch = {}, delivery: deliveryPatch = {}, binding } = {}) => {
      Object.assign(cards[0], cardPatch)
      cards[0].delivery = { ...(cards[0].delivery || {}), ...deliveryPatch }
      if (binding !== undefined) cards[0].binding = binding
    }
    window.__sweetCardListRequests = 0
    window.__archiveActions = []
    window.fetch = async (url, options = {}) => {
      const requestUrl = new URL(url, location.origin)
      const path = requestUrl.pathname
      const method = options.method || 'GET'
      const json = (data, status = 200) => Promise.resolve(new Response(JSON.stringify(data), { status, headers: { 'Content-Type': 'application/json' } }))
      if (path === '/api/v2/sweet-cards/config') return json({ enabled: true, claimPresentationEnabled: true })
      if (path === '/api/v2/sweet-cards/overview') return json(overview(requestUrl))
      if (path === '/api/v2/sweet-cards/batches' && method === 'POST') {
        window.__lastSweetCardBatchBody = JSON.parse(options.body)
        return json({ batch: commercialBatch }, 201)
      }
      if (path === '/api/v2/sweet-cards/batches') return json({ batches: scopedBatches(requestUrl) })
      const archiveMatch = path.match(/^\/api\/v2\/sweet-cards\/batches\/([^/]+)\/(archive|restore)$/)
      if (archiveMatch && method === 'POST') {
        const batch = batches.find((row) => row.id === archiveMatch[1])
        if (!batch) return json({ error: '批次不存在' }, 404)
        batch.archivedAt = archiveMatch[2] === 'archive' ? now : null
        window.__archiveActions.push({ id: batch.id, action: archiveMatch[2] })
        return json({ ok: true, batch })
      }
      if (path === '/api/v2/sweet-cards/cards') { window.__sweetCardListRequests += 1; return json({ cards: scopedCards(requestUrl) }) }
      const cardPath = path.match(/^\/api\/v2\/sweet-cards\/cards\/([^/]+)(?:\/(.+))?$/)
      if (cardPath) {
        const card = cards.find((row) => row.id === cardPath[1])
        if (!card) return json({ error: '甜意卡不存在' }, 404)
        const detail = () => ({
          ...card,
          batch: { name: batches.find((row) => row.id === card.batchId)?.name || '无批次', businessPurpose: batches.find((row) => row.id === card.batchId)?.businessPurpose, presentationTemplateKey: 'minimal-v2' },
          expiresAt: null, binding: card.binding || null,
          credentials: [{ id: 'credential-safe-id', status: card.status === 'ACTIVE' ? 'ACTIVE' : 'UNACTIVATED', carrierType: card.carrierType }],
          issuedByName: '西单操作员', issuedAt: now,
          delivery: card.delivery || {
            activationStatus: card.activatedAt ? 'ACTIVATED' : 'UNACTIVATED', presentationStatus: 'NOT_GENERATED',
            claimCredentialStatus: 'NONE', claimStatus: 'UNCLAIMED',
            bindingStatus: card.bindingMode === 'NONE' ? 'NOT_REQUIRED' : card.binding ? 'BOUND' : 'UNBOUND',
            deliveryStatus: 'NOT_PREPARED', claimedAt: null,
            claimAssetEligible: batches.find((row) => row.id === card.batchId)?.businessPurpose === 'ACCEPTANCE_TEST',
            claimAssetBlockedCode: batches.find((row) => row.id === card.batchId)?.businessPurpose === 'ACCEPTANCE_TEST' ? 'ELIGIBLE' : 'NOT_ELIGIBLE',
            claimAssetBlockedReason: batches.find((row) => row.id === card.batchId)?.businessPurpose === 'ACCEPTANCE_TEST' ? '' : '当前仍处于甜意卡领取受控验收阶段，正式商业卡暂未开放电子领取凭证生成。',
          },
          ledger: [{ id: 'ledger-1', type: 'ISSUE', amountCents: card.initialAmountCents, balanceAfterCents: card.balanceCents, createdAt: now }],
        })
        if (!cardPath[2] && method === 'GET') return json({ card: detail() })
        if (cardPath[2] === 'presentation' && method === 'PUT') {
          const body = JSON.parse(options.body)
          window.__presentationUpdates.push(body)
          Object.assign(card, body)
          return json({ ok: true, card: detail() })
        }
        if (cardPath[2] === 'claim-presentation' && method === 'POST') {
          const body = JSON.parse(options.body)
          window.__claimPresentationBodies.push(body)
          if (window.__claimPresentationResponse.delayMs) await new Promise((resolve) => setTimeout(resolve, window.__claimPresentationResponse.delayMs))
          if (window.__claimPresentationResponse.mode === 'error') return json({ error: '测试甜意卡不存在', code: 'NOT_ELIGIBLE' }, 409)
          card.delivery = { ...(detail().delivery), presentationStatus: 'GENERATED', claimCredentialStatus: 'ACTIVE', deliveryStatus: card.activatedAt ? 'READY' : 'GENERATED' }
          const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760"><rect width="1200" height="760" rx="64" fill="#fff4f8"/><text x="80" y="100" font-size="42">budu 甜意卡</text><text x="80" y="200" font-size="72">¥200.00</text><rect x="820" y="220" width="280" height="280" fill="white"/><path d="M850 250h220v220H850zM880 280h50v50h-50zM990 380h50v50h-50z" fill="#111827"/><text x="960" y="540" text-anchor="middle" font-size="24">微信扫码领取甜意卡</text></svg>'
          return json({ ok: true, claimAsset: { id: 'claim-safe-id', purpose: 'MINIPROGRAM_CLAIM', state: 'ACTIVE', carrierType: body.carrierType, expiresAt: '2026-09-12T04:30:00.000Z', fileName: `${card.publicCardNo}.claim.electronic.svg`, svgBase64: btoa(unescape(encodeURIComponent(svg))) }, presentation: { designVersion: 'minimal-v2' }, proofDelivery: { channel: 'SEPARATE_CHANNEL_REQUIRED', proof: 'FAKE-PROOF-FOR-UI-HARNESS' }, economicMutation: 'NONE' }, 201)
        }
        if (cardPath[2] === 'claim-presentation/revoke' && method === 'POST') {
          card.delivery = { ...(detail().delivery), presentationStatus: 'REVOKED', claimCredentialStatus: 'REVOKED', deliveryStatus: 'REVOKED' }
          window.__deliveryActions.push('REVOKE')
          return json({ ok: true, claimAsset: { purpose: 'MINIPROGRAM_CLAIM', state: 'REVOKED' }, revokedCount: 1 })
        }
        if (cardPath[2] === 'activate-delivery' && method === 'POST') {
          card.status = 'ACTIVE'; card.activatedAt = now
          card.delivery = { ...(detail().delivery), activationStatus: 'ACTIVATED', deliveryStatus: 'READY' }
          window.__deliveryActions.push('ACTIVATE')
          return json({ card: detail() })
        }
      }
      if (path === '/api/v2/sweet-cards/rules') return json({ stores: [], categories: [] })
      if (path === '/api/v2/sweet-cards/usage') return json({ redemptions: [] })
      if (path === '/api/v2/sweet-cards/audit') return json({ events: [] })
      return json({ error: `未模拟接口 ${path}` }, 404)
    }

    createRoot(document.getElementById('root')).render(React.createElement(SweetCardPage, {
      user: { id: 'admin', username: 'admin', role: 'admin', status: 'active', permissions: {} },
      onBack: () => { document.documentElement.dataset.back = 'true' },
    }))
  </script></body>
</html>
