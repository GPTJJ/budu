<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Schedule Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import SchedulePage from '/src/components/SchedulePage.jsx'
    import { OverlayStackManager } from '/src/components/overlay/OverlayPrimitives.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    const PARAMS = new URLSearchParams(location.search)
    const MODE = PARAMS.get('mode') || 'developer'
    const FAIL_SAVE = PARAMS.get('failSave') === '1'

    // 排班数据：本周（与 getWeekStart 同周）两个门店各两天班次
    const weekStart = (() => {
      const d = new Date()
      const day = (d.getDay() + 6) % 7 // 周一=0
      d.setDate(d.getDate() - day)
      const p = (n) => String(n).padStart(2, '0')
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
    })()
    const dateOffset = (offset) => {
      const d = new Date(weekStart)
      d.setDate(d.getDate() + offset)
      const p = (n) => String(n).padStart(2, '0')
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
    }
    const schedules = {
      [weekStart]: {
        tongying: {
          [dateOffset(1)]: [{ employeeId: 'emp-ye', staff: '叶芷辰', time: '早班' }, { employeeId: 'emp-sui', staff: '隋晓', time: '晚班' }],
          [dateOffset(3)]: [{ employeeId: 'emp-ye', staff: '叶芷辰', time: '通班', note: '主理' }],
        },
        guanshe: {
          [dateOffset(2)]: [{ employeeId: 'emp-gong', staff: '龚艺锦', time: '早班' }],
        },
      },
    }
    let serverSchedules = JSON.parse(sessionStorage.getItem('schedule-test-server') || 'null') || structuredClone(schedules)
    let versionCounter = 1
    window.schedulePutCount = 0
    window.backCount = 0

    // 共享数据镜像（userData 读取来源）
    localStorage.setItem('budu-os-cloud-mirror-v1', JSON.stringify({
      entries: {},
      staff: [
        { id: 'emp-ye', employeeNo: 'BUDU-0001', name: '叶芷辰', type: 'fulltime', storeKey: 'tongying' },
        { id: 'emp-sui', employeeNo: 'BUDU-0002', name: '隋晓', type: 'fulltime', storeKey: 'tongying' },
        { id: 'emp-gong', employeeNo: 'BUDU-0003', name: '龚艺锦', type: 'parttime', storeKey: 'guanshe' },
      ],
      removedStaff: [],
      stores: [
        { key: 'tongying', name: '北京通盈中心店' },
        { key: 'guanshe', name: '北京官舍店' },
      ],
      schedules,
      products: [],
      inventoryRequests: [],
      inventory: [],
      analysis: {},
      productImages: {},
      bigBonuses: [],
      dailyPayAdjustments: [],
      posDaily: [],
      posProductSales: [],
    }))
    seedCachedDataForTest(JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')))

    const json = (body, status = 200) => Promise.resolve(new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } }))
    window.fetch = async (input, options = {}) => {
      const url = new URL(typeof input === 'string' ? input : input.url, location.origin)
      if (url.pathname === '/api/v2/schedules/batch' && (options.method || 'GET') === 'PUT') {
        window.schedulePutCount += 1
        window.lastSchedulePutBody = JSON.parse(options.body)
        if (FAIL_SAVE) return json({ error: '测试保存失败' }, 500)
        const body = window.lastSchedulePutBody
        serverSchedules[body.weekStart] = serverSchedules[body.weekStart] || {}
        const rows = []
        const versions = {}
        for (const store of body.stores) {
          serverSchedules[body.weekStart][store.storeKey] = structuredClone(store.days)
          versions[store.storeKey] = `version-${++versionCounter}`
          for (const [date, shifts] of Object.entries(store.days)) {
            if (shifts.length > 0) rows.push({ id: `${store.storeKey}-${date}`, weekStart: body.weekStart, storeKey: store.storeKey, date, shifts, updatedAt: new Date().toISOString() })
          }
        }
        sessionStorage.setItem('schedule-test-server', JSON.stringify(serverSchedules))
        return json({ ok: true, rows, versions, emptyVersion: 'empty-version' })
      }
      if (url.pathname === '/api/v2/schedules') {
        const rows = []
        const versions = {}
        for (const [storeKey, days] of Object.entries(serverSchedules[url.searchParams.get('weekStart')] || {})) {
          for (const [date, shifts] of Object.entries(days)) rows.push({ storeKey, date, shifts })
          versions[storeKey] = `version-${versionCounter}`
        }
        return json({ rows, versions, emptyVersion: 'empty-version' })
      }
      if (url.pathname === '/api/v2/staff-list') {
        return json({ rows: JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')).staff })
      }
      if (url.pathname === '/api/v2/stores') {
        return json({ rows: JSON.parse(localStorage.getItem('budu-os-cloud-mirror-v1')).stores })
      }
      return json({ rows: [] })
    }

    const USER = {
      developer: { id: 'u-dev', username: 'budu', role: 'developer', staffKey: '' },
      staff: { id: 'u-staff', username: 'ye', role: 'staff', staffKey: 'tongying::叶芷辰', employeeId: 'emp-ye' },
      manager: { id: 'u-mgr', username: 'mgr', role: 'manager', staffKey: '' },
    }[MODE]

    const canEdit = USER.role !== 'public' && USER.role !== 'staff'

    const registerNavigationGuard = (guard) => { window.scheduleNavigationGuard = guard }
    window.triggerExternalNavigation = () => window.scheduleNavigationGuard?.(() => { window.externalNavigationCount = (window.externalNavigationCount || 0) + 1 })
    createRoot(document.getElementById('root')).render(React.createElement(React.Fragment, null,
      React.createElement(OverlayStackManager),
      React.createElement(SchedulePage, {
      user: USER,
      canEdit,
      onBack: () => { window.backCount += 1 },
      registerNavigationGuard,
      }),
    ))
  </script></body>
</html>
