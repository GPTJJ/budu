<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Gate 27 Payroll Issue Resolver Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import PayrollIssueModal from '/src/components/PayrollIssueModal.jsx'
    import { seedCachedDataForTest } from '/src/utils/userData.js'
    import '/src/index.css'

    const params = new URLSearchParams(location.search)
    const legacy = params.get('legacy') === '1'
    const unbound = params.get('unbound') === '1'
    const adjonly = params.get('adjonly') === '1'
    const race = params.get('race') === '1'
    const negative = params.get('negative') === '1'

    window.__posted = null
    window.__origFetch = window.fetch
    window.fetch = async (url, opts = {}) => {
      const u = String(url)
      const json = (body, status = 200) => Promise.resolve(new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } }))
      if (u.includes('/api/admin/users')) {
        return json({ ok: true, users: window.__users || [] })
      }
      if (u.includes('/api/v2/payroll-notices/preflight') && (opts.method || 'GET') === 'POST') {
        const body = JSON.parse(opts.body || '{}')
        const includes = (date) => date >= body.periodStart && date <= body.periodEnd
        const totalFor = (employeeId) => {
          const attendance = adjonly || legacy || !includes('2026-08-01') ? 0 : employeeId === 'emp-A' ? 68000 : 51000
          const adjustment = !includes('2026-08-10') ? 0 : employeeId === 'emp-A' ? 50000 : negative ? -80000 : -5000
          return attendance + adjustment
        }
        return json({
          ok: true,
          period: body,
          calculationReady: true,
          rows: (body.employeeIds || []).map((employeeId) => {
            const recipients = (window.__users || []).filter((user) => user.employeeId === employeeId && user.status === 'active')
            const totalCents = totalFor(employeeId)
            return { employeeId, totalCents, issueReady: recipients.length === 1 && totalCents >= 0, blockers: [], overlaps: [] }
          }),
        })
      }
      if (u.includes('/api/v2/payroll-notices') && (opts.method || 'GET') === 'POST') {
        const body = JSON.parse(opts.body || '{}')
        window.__posted = body
        return json({ ok: true, count: (body.rows || []).length, rows: body.rows || [] })
      }
      if (u.includes('/api/v2/payroll-notices') && (opts.method || 'GET') === 'GET') {
        return json({ ok: true, rows: [] })
      }
      if (u.includes('/api/v2/daily-store-staff')) {
        const month = new URL(u, location.origin).searchParams.get('month')
        if (race && month === '2026-08') await new Promise((r) => setTimeout(r, 400))
        return json({ ok: true, month, businessDate: '2026-08-31', rows: (window.__attendanceByMonth || {})[month] || [] })
      }
      if (u.includes('/api/v2/staff-list') && (opts.method || 'GET') === 'GET') {
        return json({ ok: true, rows: window.__staff || [] })
      }
      if (u.includes('/api/v2/daily-entries') && (opts.method || 'GET') === 'GET') {
        return json({ ok: true, rows: Object.entries(window.__entries || {}).map(([k, v]) => {
          const [m, storeKey, dd] = k.split('|')
          return { date: `${m}-${dd.slice(3)}`, storeKey, incCents: String(Math.round((v.inc || 0) * 100)), ord: v.ord || 0, staffNames: v.staff || [] }
        }) })
      }
      if (u.includes('/api/v2/big-bonuses') || u.includes('/api/v2/daily-pay-adjustments')) return json({ rows: [] })
      return window.__origFetch(url, opts)
    }

    const STAFF = [
      { id: 'emp-A', name: '张伟', storeKey: 'guanshe', storeName: '北京官舍店', type: 'fulltime', employeeNo: 'A001' },
      { id: 'emp-B', name: '张伟', storeKey: 'guanshe', storeName: '北京官舍店', type: 'parttime', employeeNo: 'B001' },
    ]
    window.__staff = STAFF
    window.__users = unbound
      ? [{ id: 'u1', username: 'user-a', employeeId: 'emp-A', status: 'active' }]
      : [
          { id: 'u1', username: 'user-a', employeeId: 'emp-A', status: 'active' },
          { id: 'u2', username: 'user-b', employeeId: 'emp-B', status: 'active' },
        ]
    window.__entries = adjonly ? {} : { '2026-08|guanshe|08-01': { inc: 12000, ord: 120, staff: ['张伟', '张伟'] } }
    window.__attendanceByMonth = adjonly || legacy
      ? {}
      : {
          '2026-08': [
            { id: 'a1', storeId: 'guanshe', storeKey: 'guanshe', date: '2026-08-01', employeeId: 'emp-A', participantType: 'EMPLOYEE', staffId: 'st-a', staffNameSnapshot: '张伟', actualHours: 8, historicalPayrollHours: null, payableHoursSource: 'ACTUAL_HOURS' },
            { id: 'a2', storeId: 'guanshe', storeKey: 'guanshe', date: '2026-08-01', employeeId: 'emp-B', participantType: 'EMPLOYEE', staffId: 'st-b', staffNameSnapshot: '张伟', actualHours: 6, historicalPayrollHours: null, payableHoursSource: 'ACTUAL_HOURS' },
          ],
        }
    seedCachedDataForTest({
      entries: window.__entries,
      staff: STAFF,
      removedStaff: [],
      stores: [{ key: 'guanshe', name: '北京官舍店' }],
      schedules: {}, products: [], inventoryRequests: [], inventory: [],
      analysis: {}, productImages: {}, bigBonuses: [], posDaily: [], posProductSales: [],
      dailyPayAdjustments: legacy
        ? [{ id: 'dpa-legacy', employeeId: null, staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: 50000, reason: '无身份', active: true, version: 1 }]
        : adjonly
          ? [{ id: 'dpa-adj', employeeId: 'emp-A', staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: 50000, reason: '仅调整日 +500', active: true, version: 1 }]
          : negative
            ? [
                { id: 'dpa-1', employeeId: 'emp-A', staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: 50000, reason: 'A 仅调整日 +500', active: true, version: 1 },
                { id: 'dpa-2', employeeId: 'emp-B', staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: -80000, reason: 'B 仅调整日 -800', active: true, version: 1 },
              ]
            : [
                { id: 'dpa-1', employeeId: 'emp-A', staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: 50000, reason: 'A 仅调整日 +500', active: true, version: 1 },
                { id: 'dpa-2', employeeId: 'emp-B', staffName: '张伟', date: '2026-08-10', autoPayCentsSnapshot: 0, adjustedPayCents: -5000, reason: 'B 仅调整日 -50', active: true, version: 1 },
              ],
    })

    createRoot(document.getElementById('root')).render(
      React.createElement(PayrollIssueModal, {
        onClose: () => {},
        onIssued: () => {},
      }),
    )
  </script></body>
</html>
