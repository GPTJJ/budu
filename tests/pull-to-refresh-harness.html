<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>budu pull-to-refresh gesture regression</title>
  </head>
  <body class="m-0">
    <div id="root"></div>
    <script type="module">
      import React, { useCallback, useState } from 'react'
      import { createRoot } from 'react-dom/client'
      import PullToRefresh from '/src/components/PullToRefresh.jsx'
      import Sidebar from '/src/components/Sidebar.jsx'
      import '/src/index.css'

      const user = { id: 'pull-refresh-test-user', username: '触控回归', role: 'developer' }
      window.__refreshCount = 0
      window.__navigations = []

      function Harness() {
        const [open, setOpen] = useState(false)
        const [view, setView] = useState('asset-center')
        const refresh = useCallback(() => {
          window.__refreshCount += 1
          return new Promise((resolve) => { window.__finishRefresh = resolve })
        }, [])
        return React.createElement(PullToRefresh, { onRefresh: refresh },
          React.createElement('div', { className: 'flex min-h-screen bg-canvas' },
            open && React.createElement('button', {
              'aria-label': '关闭侧栏',
              className: 'fixed inset-0 z-40 bg-slate-900/40 lg:hidden',
              onClick: () => setOpen(false),
            }),
            React.createElement(Sidebar, {
              open, view, user,
              onClose: () => setOpen(false),
              onNavigate: (key) => { window.__navigations.push(key); setView(key) },
              onUserChange: () => {},
              onLogout: () => {},
            }),
            React.createElement('main', {
              'data-testid': 'main-page', className: 'min-w-0 flex-1 bg-slate-50 p-6',
              style: { minHeight: '2600px' },
            },
              React.createElement('button', {
                className: 'fixed right-3 top-3 z-[60] rounded-xl bg-white p-3 lg:hidden',
                onClick: () => setOpen((value) => !value),
              }, '切换侧栏'),
              React.createElement('h1', { className: 'mt-16 text-lg' }, '当前业务页面'),
              React.createElement('output', { 'data-testid': 'current-view' }, view),
            ),
          ),
        )
      }

      createRoot(document.getElementById('root')).render(React.createElement(Harness))
    </script>
  </body>
</html>
