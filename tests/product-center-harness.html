<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>商品中心测试</title><script type="module" src="/src/index.css"></script></head>
  <body><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import ProductCenterPage from '/src/components/ProductCenterPage.jsx'

    let products = [{ productId: 'p-1', name: '卡皮巴拉布丁', sku: 'BUDU-001', posCategory: '甜品', salePriceCents: '7200', costPriceCents: '2350', unit: '份', image: '', barcode: '', isActive: false, trackInventory: false, sortOrder: 0, version: 1 }]
    window.__productImportPayload = null
    const reply = (body, status = 200) => Promise.resolve(new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } }))
    window.fetch = async (url, options = {}) => {
      if (url === '/api/v2/products' && (!options.method || options.method === 'GET')) return reply({ rows: products })
      if (url === '/api/v2/products/import' && options.method === 'POST') {
        const body = JSON.parse(options.body)
        window.__productImportPayload = body
        const imported = body.rows.map((row, index) => {
          const old = products.find((item) => item.sku === row.sku || item.name === row.name)
          return { ...(old || {}), ...row, productId: old?.productId || `p-${index + 2}`, image: old?.image || '', barcode: row.barcode || old?.barcode || '', isActive: true, trackInventory: row.trackInventory ?? old?.trackInventory ?? false, sortOrder: Number(row.sortOrder || old?.sortOrder || 0), version: (old?.version || 0) + 1 }
        })
        products = [...products.filter((item) => !imported.some((row) => row.productId === item.productId)), ...imported]
        return reply({ ok: true, created: imported.filter((row) => row.productId !== 'p-1').length, updated: imported.filter((row) => row.productId === 'p-1').length, rows: imported })
      }
      return reply({ error: 'not found' }, 404)
    }
    createRoot(document.getElementById('root')).render(React.createElement(ProductCenterPage, { onBack: () => {} }))
  </script></body>
</html>
