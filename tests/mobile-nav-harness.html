<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>BUDU Mobile Nav Test</title></head>
  <body class="m-0"><div id="root"></div><script type="module">
    import React from 'react'
    import { createRoot } from 'react-dom/client'
    import MobileBottomNav from '/src/components/MobileBottomNav.jsx'
    import '/src/index.css'

    window.__navigated = []
    createRoot(document.getElementById('root')).render(
      React.createElement(MobileBottomNav, {
        view: 'overview',
        user: { id: 'user-1', username: 'staff', role: 'staff', storeKeys: ['store-1'] },
        onNavigate: (key) => window.__navigated.push(key),
        onMore: () => window.__navigated.push('more'),
      }),
    )
  </script></body>
</html>
